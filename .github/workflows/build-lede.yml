name: Build Lean's LEDE for x86

on:
  workflow_dispatch:
#   schedule:
#     - cron: '0 19 * * 0' # 每周日自动编译（UTC 19:00 = 北京时间周一 03:00），按需开启

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: seed.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 检出仓库代码
      uses: actions/checkout@v4

    - name: 2. 深度清理磁盘空间
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f
        sudo swapoff -a
        sudo rm -f /swapfile
        df -h

    - name: 3. 安装编译环境依赖与配置时区
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
        libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
        libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
        python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
        upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 4. 克隆 LEDE 源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b$REPO_BRANCH lede
        ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

    - name: 5. 执行 diy-part1 并更新安装 Feeds
      run: |
        [ -e "$DIY_P1_SH" ] && chmod +x "$DIY_P1_SH" && cp "$DIY_P1_SH" lede/
        cd lede
        [ -e "$DIY_P1_SH" ] && ./"$DIY_P1_SH"
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 6. 加载配置并执行 diy-part2
      run: |
        [ -e "$DIY_P2_SH" ] && chmod +x "$DIY_P2_SH" && cp "$DIY_P2_SH" lede/
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" lede/.config
        cd lede
        [ -e "$DIY_P2_SH" ] && ./"$DIY_P2_SH"

    - name: 7. 生成完整配置并预下载依赖包 (Download Package)
      id: package
      run: |
        cd /workdir/lede
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 8. 执行固件编译
      id: compile
      run: |
        cd /workdir/lede
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s || exit 1
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 9. 检查并整理编译产物
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd /workdir/lede/bin/targets/*/* || (echo "Targets directory does not exist!" && exit 1)
        rm -rf packages
        rm -rf *rootfs*.tar.gz
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 10. 上传固件至 GitHub Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 11. 生成 Release 标签与发布信息
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=LEDE-$(date +"\%Y.\%m.\%d-\%H\%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "### 固件构建信息" >> release.txt
        echo "- **目标架构**: x86_64 工控机 (支持 UEFI / Legacy 引导)" >> release.txt
        echo "- **源码分支**: ${{ env.REPO_URL }} [${{ env.REPO_BRANCH }}]" >> release.txt
        echo "- **构建时间**: $(date +"%Y年%m月%d日 %H:%M:%S")" >> release.txt
        echo "- **默认后台 IP**: \`192.168.2.1\`" >> release.txt
        echo "- **默认账号密码**: \`root\` / \`password\`" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 12. 自动发布至 GitHub Releases
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.release_tag && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
